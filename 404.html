<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page not found</title>
    <link rel="icon" type="image/ico" href="/images/favicon.ico">
    <style>
        /* Reuse existing variables and base styles */
        :root {
            --primary-color: #000000;
            --accent-color: #00ff88;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--primary-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px; /* Added mobile padding */
            overflow: hidden; /* Prevent scrollbars */
            position: relative; /* For snowflakes */
        }

        .error-container {
            text-align: center;
            padding: 30px;
            max-width: 800px;
            width: 100%; /* Full width on mobile */
            box-sizing: border-box; /* Include padding in width */
            position: relative; /* Ensure it's above the snow */
            z-index: 1; /* Lower z-index than snowflakes */
        }

        .error-container img {
            max-width: 80%; /* Responsive image */
            height: auto;
            margin-bottom: 20px;
        }

        .dimensional-box {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            transform: rotateY(15deg) rotateX(5deg);
            border: 2px solid var(--accent-color);
            padding: 20px;
            background: rgba(50, 50, 50, 0.3);
            margin: 20px auto;
            max-width: 600px;
            width: 90%; /* Better mobile width */
            overflow: hidden;
        }

        .error-code {
            font-size: 6em; /* Reduced base size */
            margin: 0;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            animation: glitch 2s infinite;
            line-height: 1; /* Better spacing */
        }

        .error-message {
            font-size: 1.2em; /* Reduced base size */
            margin: 15px 0;
            line-height: 1.4;
        }

        .home-button {
            background-color: var(--accent-color);
            color: var(--primary-color);
            border: 2px solid var(--accent-color);
            padding: 12px 25px; /* Smaller padding */
            border-radius: 5px;
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 25px;
            display: inline-block;
            font-size: 0.95em; /* Smaller font */
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* Snowflakes */
        .snowflake {
            position: absolute;
            top: -10px;
            color: #ffffff;
            font-size: 1em;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 2; /* Higher z-index to overlay everything */
        }

        @keyframes fall {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }

        /* Mobile-first adjustments */
        @media (max-width: 768px) {
            .error-container {
                padding: 20px;
            }

            .dimensional-box {
                padding: 15px;
                margin: 15px auto;
                transform: none; /* Disable 3D effect on mobile */
            }

            .error-code {
                font-size: 4em;
            }

            .error-message {
                font-size: 1.1em;
            }

            .home-button {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 3.5em;
            }

            .error-message {
                font-size: 1em;
            }

            .dimensional-box {
                width: 100%;
                padding: 10px;
            }

            .home-button {
                width: 100%; /* Full width button */
                max-width: 280px; /* But not too wide */
            }

            body {
                padding: 15px;
                justify-content: flex-start; /* Better spacing */
                padding-top: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <img src="images/banner2.png" alt="Ethereal Logo" class="mobile-logo">
        <div class="dimensional-box">
            <h1 class="error-code">404</h1>
            <p class="error-message">Not found</p>
            <p>It looks like you stumbled upon a non-existent page.</p>
            <p>＞▽＜</p>
        </div>
        <a href="index.html" class="home-button">Go back to homepage</a>
    </div>

    <script>
        // Easter egg: snowfall on typing "winter"
        let inputSequence = '';
        const easterEggTrigger = 'winter';

        document.addEventListener('keydown', (event) => {
            inputSequence += event.key.toLowerCase(); // Add the pressed key to the sequence
            if (inputSequence.length > easterEggTrigger.length) {
                inputSequence = inputSequence.slice(-easterEggTrigger.length); // Keep only the last N characters
            }
            if (inputSequence === easterEggTrigger) {
                activateSnowfall();
            alert("Who knew that asterisks could look like snow?!")
            }
        });

        // Snowfall effect
        let snowfallInterval;

        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '*';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 3 + 2 + 's'; // Random speed
            snowflake.style.opacity = Math.random(); // Random opacity
            snowflake.style.fontSize = Math.random() * 20 + 10 + 'px'; // Random size
            document.body.appendChild(snowflake);

            // Remove snowflake after it falls
            setTimeout(() => {
                snowflake.remove();
            }, 5000);
        }

        function activateSnowfall() {
            if (snowfallInterval) return; // Prevent multiple activations
            snowfallInterval = setInterval(createSnowflake, 300);
        }

        // Optimized mobile audio handling
        document.addEventListener('DOMContentLoaded', function() {
            const audio = new Audio('images/ethereal.mp3');
            audio.volume = 0.2;
            audio.loop = true;

            // Touchstart listener for mobile compatibility
            const enableAudio = () => {
                audio.play().catch(error => {
                    console.log('Audio playback failed:', error);
                });
                document.body.removeEventListener('click', enableAudio);
                document.body.removeEventListener('touchstart', enableAudio);
            };
            
            document.body.addEventListener('click', enableAudio, { once: true });
            document.body.addEventListener('touchstart', enableAudio, { once: true });
            
            document.querySelector('.home-button').addEventListener('click', () => {
                if(audio.paused) audio.play();
            });
        });
    </script>
</body>
</html>
